[project]
name = "hfcache"
version = "0.1.3"
description = "Archive complete revisions of public Hugging Face repositories on long-term storage"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tyler", email = "tyler@wtcross.com" }]
keywords = ["huggingface", "archive", "nfs", "zfs", "provenance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Archiving :: Mirroring",
    "Typing :: Typed",
]
dependencies = [
    "huggingface-hub>=0.36",
    "pydantic>=2.11",
    "typer>=0.16",
]

[project.scripts]
hfcache = "hfcache.cli:app"

[dependency-groups]
dev = [
    "hypothesis>=6.140",
    "pyrefly>=0.40",
    "pytest>=8.4",
    "pytest-cov>=7.0",
    "ruff>=0.14",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "hfcache"
module-root = "src"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# target-version is inferred from project.requires-python.

[tool.ruff.lint]
select = [
    "A",     # flake8-builtins
    "ANN",   # flake8-annotations: pyrefly infers, it does not require annotations
    "ARG",   # unused arguments
    "B",     # flake8-bugbear
    "BLE",   # blind except
    "C4",    # comprehensions
    "DTZ",   # flake8-datetimez: every timestamp must be timezone-aware
    "E",     # pycodestyle errors
    "EM",    # error messages assigned before raise
    "ERA",   # commented-out code
    "F",     # pyflakes
    "FBT",   # boolean trap in signatures
    "G",     # logging format
    "I",     # import sorting
    "ICN",   # import conventions
    "INP",   # implicit namespace packages
    "ISC",   # implicit string concatenation
    "N",     # pep8-naming
    "PERF",  # performance antipatterns
    "PIE",   # misc lints
    "PL",    # pylint
    "PT",    # pytest style
    "PTH",   # use pathlib
    "Q",     # quotes
    "RET",   # return hygiene
    "RSE",   # raise
    "RUF",   # ruff-specific
    "S",     # flake8-bandit
    "SIM",   # simplify
    "SLF",   # private member access
    "T20",   # no print()
    "TC",    # type-checking imports
    "TID",   # tidy imports
    "TRY",   # exception hygiene
    "UP",    # pyupgrade
    "W",     # pycodestyle warnings
]
ignore = [
    "ISC001",  # conflicts with the formatter
    "TRY003",  # long messages outside exception classes; the error taxonomy needs detail
]
# S101 (assert) is deliberately NOT ignored for src/: an assert used as a safety
# check disappears under `python -O`. Safety checks raise. Tests may assert.

[tool.ruff.lint.per-file-ignores]
# Tests may assert, touch privates, and use fixtures freely. INP001 is expected
# for the suite directories: they stay namespace directories under
# --import-mode=importlib so a test module's name never depends on where it sits.
# `tests/` and `tests/fixtures/` are real packages, because the shared fixture
# builders need one importable name that pytest and pyrefly both agree on.
"tests/**" = ["ANN", "ARG001", "ARG002", "INP001", "PLR2004", "S", "SLF001"]
# Typer expresses flags as boolean parameters with defaults, and the global
# options callback necessarily takes one parameter per option. That is the
# framework's interface, not a boolean trap or a wide signature in our own API.
"src/hfcache/cli.py" = ["FBT001", "FBT002", "PLR0913", "PLR0917"]
# Operator scripts, not application code, and the rules that fit `src/` do not fit
# them. A probe whose entire output is a report prints (T201); it asserts, because
# an assertion that vanishes under `python -O` is exactly right for something run
# by hand and never in production (S101); it imports inside functions so a missing
# dependency is attributed to the check that needed it (PLC0415); it is a script
# rather than a package (INP001); and its decorators are plumbing that pyrefly
# infers (ANN). S108 is /tmp as a documented fallback for CACHE_DIRECTORY.
"scripts/**" = ["ANN", "INP001", "PLC0415", "S101", "S108", "SIM117", "T201"]
# The consumer helper is a standalone example that runs on a *downstream* host,
# with the standard library and nothing else — it must not import `hfcache`, so
# the application's reporting conventions are not available to it. Its entire
# interface is stdout and stderr (T201), and it is a script rather than a package
# (INP001). Everything else in the ruleset applies to it and is enforced: the path
# containment, the streamed hashing, and the exception hygiene are the point of it.
"examples/**" = ["INP001", "T201"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
# `tests` is first-party too: the golden-fixture examples in tests/fixtures are
# imported as `tests.fixtures.examples`, and grouping them with third-party
# packages would misrepresent where they come from.
known-first-party = ["hfcache", "tests"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    # Opt-in suites are deselected by default; a command-line -m overrides this.
    "-m",
    "not live and not nfs and not build",
]
markers = [
    "live: contacts the Hugging Face Hub; run with -m live",
    "nfs: requires the live NFS archive mount; run with -m nfs",
    "build: builds artifacts and a throwaway venv; run with -m build",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/hfcache"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    'if __name__ == "__main__":',
]

[tool.pyrefly]
project-includes = ["src", "tests"]
# Order matters. `src` first, so a module there is `hfcache.x` and nothing else;
# the project root second, so `tests.fixtures.examples` resolves to the same name
# the suite imports at runtime. Rooting at `.` alone would give every module in
# `src` a second identity, `src.hfcache.x`, that does not compare equal to the
# first — which surfaces as a type error on `self` in a classmethod.
search-path = ["src", "."]
python-version = "3.14"
untyped-def-behavior = "check-and-infer-return-type"
# Suppressions must be pyrefly's own; another tool's ignore comment does not
# silence a type error here.
permissive-ignores = false

