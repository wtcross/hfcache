 {slug:'orion',id:'example-lab/Orion-8B-Instruct-GGUF',type:'model',tags:['task:chat','team:research','tier:prod'],format:'GGUF',variant:'3 complete primary variants',size:'18.7 GiB',revisions:3,files:9,status:'Published',enabled:true,archived:true,coverage:'Complete',verified:true},

function stats(){return `<div class="summary-grid"><div class="stat"><div class="between"><span class="eyebrow">Library repositories</span>${I('box')}</div><div class="value">8</div><div class="hint">6 models · 2 datasets · includes configured</div></div><div class="stat"><div class="between"><span class="eyebrow">Retained revisions</span>${I('layers')}</div><div class="value">15</div><div class="hint">Across 7 published repositories</div></div><div class="stat"><div class="between"><span class="eyebrow">Active operations</span>${I('activity')}</div><div class="value">1</div><div class="hint">Sync · running in the writer</div></div><div class="stat"><div class="between"><span class="eyebrow">Metadata coverage</span>${I('info')}</div><div class="value inline">5 <span>of 7 current publications complete</span></div><div class="hint">1 partial · 1 missing observation</div></div></div>`}

function tableRows(){const rows=libraryRows();return rows.length?rows.map(r=>`<tr><td><div class="repo-name"><div class="repo-icon ${r.type==='dataset'?'dataset':''}">${I(r.type==='dataset'?'book':'box')}</div><div><button class="repo-link" data-repo="${r.slug}"><span class="owner">${E(r.id.split('/')[0])}</span>${E(r.id.split('/')[1])}</button><div class="repo-tags">${r.tags.slice(0,2).map(t=>T(t)).join('')}${r.tags.length>2?'<span class="tag">+1</span>':''}</div></div></div></td><td><span class="strong">${r.format}</span><span class="subtext">${r.type==='model'?(r.slug==='orion'?'Q4_K_M · Q5_K_M · Q8_0':r.variant):r.variant}</span></td><td>${B(r.status,r.status==='Published'?'green':r.status==='Unmanaged'?'amber':'gray',r.status==='Published')}<span class="subtext">${r.enabled===true?'Sync enabled':r.enabled===false?'Sync disabled':'Last-observed tags'}</span></td><td><span class="strong nowrap">${r.size}</span><span class="subtext">${r.revisions} retained revision${r.revisions===1?'':'s'}</span></td><td class="small-icon"><button class="button text icon-button" aria-label="View ${E(r.id)}" data-repo="${r.slug}">${I('chevron')}</button></td></tr>`).join(''):`<tr><td colspan="5"><div class="empty">${I('search')}<h3>No known matches</h3><p>Try another repository ID or tag. Incomplete technical coverage is not proof that a variant is absent.</p><button class="button" data-action="clear">Clear filters</button></div></td></tr>`}
function library(){const allTags=[...new Set(repositories.flatMap(r=>r.tags))].sort();return `<div class="heading"><div><h1>Library</h1><p>Models and datasets in your archive. Find, inspect, and manage what you retain.</p></div><div class="actions"><button class="button" data-action="sync-all" ${disconnected?'disabled':''}>${I('sync')}Sync configured</button><button class="button primary" data-action="add" ${disconnected?'disabled':''}>${I('plus')}Add repository</button></div></div>${stats()}<div class="search-line"><div class="search">${I('search')}<input id="search" aria-label="Search repository IDs or operator tags" placeholder="Search repository IDs or operator tags…" value="${E(query)}"><kbd>/</kbd></div><select class="select" id="scope" aria-label="Repository scope"><option value="all" ${scope==='all'?'selected':''}>All: archived + configured</option><option value="archived" ${scope==='archived'?'selected':''}>Archived repositories</option><option value="configured" ${scope==='configured'?'selected':''}>Configured repositories</option></select></div><div class="between"><div class="tabs mb0" role="tablist" aria-label="Repository types">${[['all','All repositories',8],['model','Models',6],['dataset','Datasets',2]].map(([v,l,c])=>`<button role="tab" aria-selected="${type===v}" class="${type===v?'active':''}" data-type="${v}">${l}<span>${c}</span></button>`).join('')}</div><span class="tiny muted">Local catalog · no Hub requests</span></div><div style="height:17px"></div><div class="filterline"><span class="eyebrow">Filter by</span><button class="filterpill ${format?'on':''}" data-action="format">${I('filter')}${format||'Format'}${I('down')}</button><button class="filterpill" data-action="technical">Quantization${I('down')}</button><button class="filterpill" data-action="revision-scope">Current publications${I('down')}</button>${filterTags.map(t=>`<button class="filterpill on" data-tag="${E(t)}">${E(t)}${I('close')}</button>`).join('')}${filterTags.length||query||format?'<button class="button text small" data-action="clear">Clear filters</button>':''}</div><div class="library-layout"><div><div class="panel"><div class="table-wrap"><table class="repo-table"><thead><tr><th>Repository</th><th>Available content</th><th>Archive state</th><th>Current snapshot</th><th></th></tr></thead><tbody id="repo-rows">${tableRows()}</tbody></table></div><div class="table-foot"><span id="match-count">${libraryRows().length} known matches · sample catalog</span><span>Illustrative ordering · complete demo set</span></div></div><div class="note mt16">${I('info')}<span><strong>Availability is not integrity.</strong> Technical observations describe retained content. Open a repository for exact publication identity and its last verification result.</span></div></div><aside class="library-aside"><div class="panel side-box" style="margin-bottom:16px"><div class="between"><h3 class="mb0">Operator tags</h3><span class="tiny muted">match all</span></div><p class="tiny muted mt8">Your labels, separate from upstream metadata.</p>${allTags.map(t=>`<button class="tag-filter ${filterTags.includes(t)?'active':''}" data-tag="${E(t)}"><span class="name"><span class="check-box"></span>${E(t)}</span><span>${repositories.filter(r=>r.tags.includes(t)).length}</span></button>`).join('')}<div class="divider" style="margin:12px 0"></div><span class="tiny muted">Edit tags on a repository or in Configuration. Tags never grant access.</span></div><div class="panel side-box"><h3>Know your coverage</h3><p class="tiny muted">Current published metadata, independent of archive integrity.</p><div class="coverage-track"><span></span><span></span><span></span></div><div class="legend-row"><span>Complete observations</span><strong>5</strong></div><div class="legend-row"><span>Partial observations</span><strong>1</strong></div><div class="legend-row"><span>Not captured</span><strong>1</strong></div><button class="button text small mt8" data-action="refresh" ${disconnected?'disable function renderedReadme(r){const isData=r.type==='dataset';return `<div class="readme"><div class="eyebrow" style="font-size:9px;margin-bottom:9px">${isData?'Dataset card':'Model card'} · archived documentation</div><h1>${isData?'Research Corpus':'Orion 8B Instruct'}</h1><p>${isData?'A fictional research corpus for retrieval experiments and evaluation. This card demonstrates how archived dataset documentation could appear in hfcache.':'A fictional instruction-tuned language model, used here to demonstrate an archive-first detail page. All descriptions and measurements in this mockup are illustrative.'}</p><div class="readme-tags"><span class="tag">${isData?'text corpus':'text-generation'}</span><span class="tag">English</span><span class="tag">Apache-2.0</span></div><blockquote>${isData?'Dataset formats, configuration names, and split names below are upstream declarations—not verified row counts or proof of external data completeness.':'This page shows the card captured for the selected immutable publication—not the current README on Hugging Face.'}</blockquote><h2>${isData?'Dataset organization':'Available formats'}</h2><p>${isData?'The retained repository declares two configurations. Local manifest entries and captured declarations remain inspectable without executing a dataset loader.':'This repository contains several GGUF variants. hfcache archives every file in the selected revision; the variants below are a discovery view, not download filters.'}</p><table><thead><tr><th>${isData?'Configuration':'Encoding'}</th><th>${isData?'Declared split':'Weight bytes'}</th><th>${isData?'Evidence':'Declared member set'}</th></tr></thead><tbody>${isData?'<tr><td>research</td><td>train, validation</td><td>dataset_info.json</td></tr><tr><td>evaluation</td><td>test</td><td>README.md</td></tr>':'<tr><td>Q4_K_M</td><td>4.8 GiB</td><td>Complete · 1 file</td></tr><tr><td>Q5_K_M</td><td>5.7 GiB</td><td>Complete · 1 file</td></tr><tr><td>Q8_0</td><td>8.2 GiB</td><td>Complete · 1 file</td></tr>'}</tbody></table><h2>${isData?'Intended use and limitations':'Intended use and limitations'}</h2><p>${isData?'Intended for offline experiments. Validate licensing and suitability before use. The web interface does not fetch remote data files or present executable dataset previews.':'Intended for offline research and prototyping. Weight size does not establish runtime memory requirements, hardware compatibility, or suitability for a particular task.'}</p><div class="note">${I('shield')}<span>External images and embedded content are blocked. Code is displayed as text; nothing in this card is executed.</span></div></div>`}
function readmePanel(r){const name=r.type==='dataset'?'Research Corpus':'Orion 8B Instruct';const source=`---\nlanguage: en\nlicense: apache-2.0\npipeline_tag: text-generation\n---\n\n# ${name}\n\nAbbreviated source fixture for the hfcache design preview.\nThis prototype does not contain the full source for the rendered example.\n\n## Intended use and limitations\n\nOffline research and prototyping.\n\nThis source is captured from the selected publication.\nNo content is fetched from the Hub while viewing the card.\n`;return `<div class="panel"><div class="panel-head between"><div class="row small-icon">${I('book')}<span class="strong small">README.md</span>${B('Archived copy','blue')}</div><div class="mini-tabs" role="tablist" aria-label="Readme display"><button role="tab" aria-selected="${!raw}" data-action="readme-rendered" class="${!raw?'active':''}">Rendered</button><button role="tab" aria-selected="${raw}" data-action="readme-source" class="${raw?'active':''}">Source</button></div></div>${raw?`<pre class="code" style="margin:20px;min-height:450px;white-space:pre-wrap">${E(source)}</pre>`:renderedReadme(r)}<div class="readme-footer">${I('lock')}<span>Publication-pinned · ${revision==='current'?'8a73b2e516c9':'613a05f68d2d'} · captured Oct 19 · 8.4 KiB · no external requests</span></div></div>`}

function openDialog(title,body,footer){const d=document.querySelector('#dialog');d.innerHTML=`<div class="dialog-head"><h2>${title}</h2><button class="button text icon-button" data-action="close" aria-label="Close dialog">${I('close')}</button></div><div class="dialog-body">${body}</div><div class="dialog-foot">${footer||'<button class="button" data-action="close">Close</button>'}</div>`;if(!d.open)d.showModal()}
function jobDialog(title,path){openDialog(title,`<p>This control demonstrates an existing operation, not a new hfcache domain feature.</p><pre class="code">POST /api/v1/${E(path)}\nIdempotency-Key: &lt;one original key&gt;</pre><div class="note">${I('info')}<span>Production must show the exact scope, respect backend and host guards, and preserve the original operation handle before sending. This prototype submits nothing.</span></div>`,`<button class="button" data-action="close">Close</button><button class="button primary" data-action="demo-operation">View operation mockup ${I('arrow')}</button>`)}
function tagsDialog(){const r=currentRepo();pendingTags=null;openDialog('Edit operator tags',`<p><strong>${E(r.id)}</strong><br>Tags live in the installed archive configuration. They are not upstream metadata or access rules.</p><div class="config-field"><label for="tag-input">Tags, separated by commas</label><textarea id="tag-input" rows="3">${E(r.tags.join(', '))}</textarea><span class="help">Lowercase letters, numbers, . _ : / - · up to 64 tags · no hierarchy</span></div><div class="note">${I('tag')}<span>Review the normalized change, then use the guarded configuration workflow. Editing tags does not trigger a sync.</span></div><p id="tag-error" class="small" style="color:var(--red);margin-top:14px;margin-bottom:0"></p>`,`<button class="button" data-action="close">Cancel</button><button class="button primary" data-action="review-tags">Review change ${I('arrow')}</button>`)}
function reviewTags(){const value=document.querySelector('#tag-input').value;let tags=value.split(',').filter(v=>v.trim());const norm=tags.map(t=>t.replace(/^ +| +$/g,'').replace(/[A-Z]/g,c=>c.toLowerCase()));if(tags.length>64||tags.some(t=>t.length>128)||norm.some(t=>!(/^[a-z0-9][a-z0-9._:/-]{0,63}$/).test(t))){document.querySelector('#tag-error').textContent='One or more tags has invalid syntax or exceeds the allowed bounds.';return}pendingTags=[...new Set(norm)].sort();const before=currentRepo().tags;openDialog('Review configuration change',`<p>Only operator tags would change for <strong>${E(currentRepo().id)}</strong>.</p><div class="diff mono"><span class="minus">− tags = ${E(JSON.stringify(before))}</span><br><span class="plus">+ tags = ${E(JSON.stringify(pendingTags))}</span></div><div class="config-steps"><span class="active">Candidate</span><span>Validate</span><span>Preview</span><span>Apply & confirm</span></div><div class="note warn">${I('lock')}<span>The live UI must bind validation, the required successful preview, and installation to exact candidate/base content. An operational fingerprint alone cannot detect a tag-only edit.</span></div><p class="tiny muted mt16 mb0">The button below changes only this in-memory mockup. It does not claim successful API validation or installation.</p>`,`<button class="button" data-action="close">Cancel</button><button class="button primary" data-action="apply-demo-tags">Apply to mockup only</button>`)}
function addDialog(){openDialog('Add repository to configuration',`<div class="row-grid"><div class="config-field"><label for="add-type">Repository type</label><select id="add-type"><option>Model</option><option>Dataset</option></select></div><div class="config-field"><label for="add-revision">Requested revision</label><input id="add-revision" value="main"></div></div><div class="config-field"><label for="add-id">Repository ID</label><input id="add-id" value="example-lab/New-Repository"></div><div class="config-field"><label for="add-tags">Operator tags</label><input id="add-tags" value="team:research, stage:evaluation"></div><div class="note">${I('layers')}<span>hfcache archives the complete revision. There are no include/exclude filters or per-quantization download choices.</span></div><div class="config-steps"><span class="active">Configure</span><span>Validate</span><span>Preview</span><span>Apply & confirm</span></div>`,`<button class="button" data-action="close">Cancel</button><button class="button primary" data-action="add-review">Review candidate concept</button>`)}
document.addEventListener('click',async(ev)=>{const target=ev.target.closest('button');if(!target||target.disabled)return;if(target.dataset.nav){document.querySelector('#dialog').close();navigate(target.dataset.nav);return}if(target.dataset.repo){navigate('detail',target.dataset.repo);return}if(target.dataset.type){type=target.dataset.type;if(type==='dataset')format='';render();return}if(target.dataset.tag){const t=target.dataset.tag;filterTags=filterTags.includes(t)?filterTags.filter(x=>x!==t):[...filterTags,t];if(view!=='library')navigate('library');else render();return}if(target.dataset.tab){tab=target.dataset.tab;window.location.hash=`/library/${currentRepo().type}/${slug}/${tab}`;render();return}if(target.dataset.admin){adminTab=target.dataset.admin;render();return}if(target.dataset.editRepo){slug=target.dataset.editRepo;tagsDialog();return}if(target.dataset.revision){revision=target.dataset.revision;tab='overview';render();return}if(target.dataset.maint){jobDialog('Preview '+target.dataset.maint,target.dataset.maint==='quarantine'?'quarantine-plans':target.dataset.maint==='recovery'?'recovery-plans':target.dataset.maint+'-plans');return}
const a=target.dataset.action;if(!a)return;switch(a){case'menu':document.querySelector('#sidebar').classList.toggle('open');break;case'close':document.querySelector('#dialog').close();break;case'clear':filterTags=[];query='';format='';render();break;case'disconnect':disconnected=!disconnected;render();break;case'tags':tagsDialog();break;case'review-tags':reviewTags();break;case'apply-demo-tags':if(pendingTags){currentRepo().tags=pendingTags;pendingTags=null;document.querySelector('#dialog').close();render();toast('Tags updated in the mockup only. No server configuration was changed.')}break;case'add':addDialog();break;case'add-review':openDialog('Candidate workflow concept',`<p>In production, the backend would validate and preview the exact candidate, then allow a separately confirmed, atomic application.</p><div class="note warn">${I('info')}<span>Installed-configuration read/apply is a real API gap. No repository was added by this prototype.</span></div>`);break;case'format':format=format?'':type==='dataset'?'Parquet':'GGUF';render();toast(format?'Demo format filter: '+format:'Format filter cleared');break;case'technical':openDialog('Technical filters',`<p>The API already supports format, quantization scheme/method, known bits, and maximum variant weight bytes. Technical predicates must match one supported complete primary variant in one publication.</p><div class="note">${I('info')}<span>Unknown or incomplete coverage must remain visible. Weight bytes are not a RAM-fit recommendation. The prototype does not implement this full filter editor.</span></div>`);break;case'revision-scope':openDialog('Revision scope',`<p>The production catalog can search <strong>current</strong> or <strong>all retained</strong> publications. Every match remains pinned to an exact SHA and publication ID.</p><p>This fixture Library displays current-publication summaries only. The detail-page selector demonstrates older-publication identity.</p>`);break;case'readme-source':raw=true;render();break;case'readme-rendered':raw=false;render();break;case'sync':jobDialog('Sync this configured repository','syncs');break;case'sync-all':jobDialog('Sync enabled configured repositories','syncs');break;case'verify':jobDialog('Verify the selected revision','verifications');break;case'refresh':jobDialog('Refresh offline catalog metadata','catalog/refreshes');break;case'doctor':jobDialog('Read-only diagnostics','diagnostics');break;case'demo-operation':document.querySelector('#dialog').close();navigate('operations');break;case'reconcile':if(disconnected){toast('Restore the demo connection first. Accepted work must not be replayed.')}else{toast('Production would look up or observe the original operation. This is a static running fixture.')}break;case'handles':try{await navigator.clipboard.writeText('ILLUSTRATIVE hfcache operation\noperation: op_20261020_134200_demo\nkey: 82bed34a-92c8-4b1c-a45e-6ca7d8b3d022\narchive: archive-demo');toast('Illustrative recovery handles copied.')}catch{openDialog('Illustrative recovery handles','<pre class="code">operation: op_20261020_134200_demo\nkey: 82bed34a-92c8-4b1c-a45e-6ca7d8b3d022\narchive: archive-demo</pre>')}break;case'hub':openDialog('Upstream repository link',`<p>Production would open the canonical, type-aware Hugging Face repository page in a separate tab, with no credentials, referrer, or opener.</p><p>The sample repository is fictional, so this prototype does not navigate to an external site.</p>`);break;case'edit-config':adminTab='configuration';navigate('administration');break;case'raw-config':openDialog('Candidate policy excerpt',`<pre class="code">[[repositories]]\ntype = "model"\nid = "example-lab/Orion-8B-Instruct-GGUF"\nrevision = "main"\nenabled = true\ntags = ["task:chat", "team:research", "tier:prod"]</pre><p>Illustrative excerpt only, not a complete hfcache configuration. Exact installed-base and candidate bytes remain server-owned; redacted credential placeholders must never be written back.</p>`);break;case'journal':openDialog('Host journal — proposed API surface',`<p>Bounded journal reads would allow only approved hfcache units and the selected service manager. No arbitrary unit names, commands, filesystem paths, or generic host access.</p><div class="note">${I('info')}<span>Journal messages are diagnostic context, not proof of domain success. Operation receipts and run reports remain authoritative.</span></div>`);break;case'reports':case'report-detail':openDialog('Run reports',`<p>The API already provides paginated report inventories and exact report reads. HTTP status alone does not establish a successful domain result.</p><pre class="code">GET /api/v1/runs\nGET /api/v1/runs/{run_id}</pre><div class="note">${I('info')}<span>Render the original Envelope warnings, errors, partial outcomes, exit classification, and domain run identity. Report examples are not implemented in this interaction prototype.</span></div>`);break;case'consumer':openDialog('Consume an immutable publication',`<p>The production UI should expose the exact reference/manifest and read-only NFS tree locator, then point to the existing independent copy-and-verify workflow.</p><div class="note">${I('lock')}<span>No model bytes are downloaded through this UI. Select and verify the exact publication; do not silently substitute a newer current revision.</span></div>`);break;}});
document.addEventListener('input',ev=>{if(ev.target.id==='search'){query=ev.target.value;document.querySelector('#repo-rows').innerHTML=tableRows();document.querySelector('#match-count').textContent=libraryRows().length+' known matches · sample catalog';}});
document.addEventListener('change',ev=>{if(ev.target.id==='scope'){scope=ev.target.value;render()}else if(ev.target.id==='revision'){revision=ev.target.value;render()}});
document.addEventListener('keydown',ev=>{if(ev.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)&&!document.querySelector('#dialog').open){ev.preventDefault();if(view!=='library')navigate('library');document.querySelector('#search')?.focus()}});
function fromHash(){const parts=window.location.hash.replace(/^#\/?/,'').split('/');if(parts[0]==='library'&&parts[2]){view='detail';slug=repositories.some(r=>r.slug===parts[2])?parts[2]:'orion';tab=['overview','variants','files','revisions','integrity','activity'].includes(parts[3])?parts[3]:'overview'}else if(['library','operations','maintenance','administration'].includes(parts[0]))view=parts[0];else view='library';render()}
window.addEventListener('hashchange',fromHash);fromHash();
</script></body></html>
