# Install only after reviewing/provisioning the independent helper policy.
# API-only address parent: no caller can replace the directory or its leaves.
d /run/hfcache-host-helper 0755 root root -
d /run/hfcache-host-helper/api 0750 root hfcache -
# Apply the installed SELinux fcontext for this exact runtime subtree.
z /run/hfcache-host-helper/api 0750 root hfcache -

# Private durable outcomes; never create/remove the pending marker or replace the lock.
d /etc/hfcache/.configuration-applications 0700 root root -
