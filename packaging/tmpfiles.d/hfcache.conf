# /run/hfcache — where the one exclusive lock lives (docs/deployment-centos-stream-10.md native profile, the hardening policy).
#
# The units declare RuntimeDirectory=hfcache, which creates this with the right
# ownership for every scheduled run. This fragment exists for the other caller:
# an operator invoking the CLI directly. /run is a tmpfs, so the directory cannot
# be provisioned once — it has to be recreated at every boot, and the service
# account has no write access to /run itself and so cannot create it on demand.
#
# Mode 0700 matches locking.LOCK_DIRECTORY_MODE. The lock is flock(2) on a file
# here, so the kernel releases it when the holder dies and a crashed run never
# leaves a lock an operator has to clear.
#
# Install to /etc/tmpfiles.d/hfcache.conf and apply with:
#   systemd-tmpfiles --create /etc/tmpfiles.d/hfcache.conf
d /run/hfcache 0700 hfcache hfcache -
