# Dirty-page bounds for a guest whose workload is streaming writes (docs/security.md hardening posture's
# companion at the host layer; installed by docs/deployment-centos-stream-10.md §9).
#
# The units cap their page cache with `MemoryHigh=` (decision 86), but a cap only
# works if the pages under it are reclaimable, and dirty pages are not — they
# must reach the NFS server first. The kernel defaults are ratios of total RAM
# (`vm.dirty_ratio = 20`, ~4.8 GiB on a 24 GiB guest), which lets a sync's
# unwritten data alone fill the entire `MemoryHigh=` budget and stall reclaim.
# Absolute figures decouple writeback from guest size: background writeback
# starts at 1 GiB, writers block at 2 GiB — half the units' 4 GiB `MemoryHigh=`,
# so reclaim always has clean pages to take, and writeback runs steadily behind
# the transfer instead of in bursts. These are guest-wide knobs, which is
# acceptable because this guest exists for this workload.
vm.dirty_background_bytes = 1073741824
vm.dirty_bytes = 2147483648
