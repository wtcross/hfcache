# Persistent journald storage with a bounded size and age (docs/cli.md output discipline).
#
# Why this file exists at all. the CLI event contract requires "persistent journald storage with a
# documented size or age limit", and CentOS Stream 10 ships neither: there is no
# /etc/systemd/journald.conf on this host, the compiled default is
# `Storage=auto`, and `auto` means persistent *only if /var/log/journal already
# exists*. It did not. Every line this deployment logged was going to
# /run/log/journal and would have been lost at the next boot — including the
# boot that handoff item 6 asks an operator to perform.
#
# That matters more here than the generic argument for persistent logs. The
# durable run report under `runs/` only exists when a run gets far enough to
# write one; a run that dies in preflight, mid-download, or on a lock timeout
# leaves nothing behind but systemd's exit code. The journal is the only record
# of those, so a volatile journal means the failures an operator most needs to
# diagnose are exactly the ones that do not survive.
#
# This is host-wide policy set by an application package, which would be
# presumptuous on a shared machine. This is a dedicated single-purpose writer VM
# (docs/deployment-centos-stream-10.md native profile), and §33 requires that a fresh one be reproducible from
# documentation — so the setting ships with the release rather than living only
# in a runbook step somebody has to remember.
#
# Install to /etc/systemd/journald.conf.d/hfcache.conf and apply with:
#   systemctl restart systemd-journald && journalctl --flush
# Verify with:
#   journalctl --disk-usage        # reports the /var/log/journal store
#   ls -d /var/log/journal         # created by journald under Storage=persistent

[Journal]
# `persistent`, not `auto`: the guarantee must not depend on a directory having
# been created by hand. journald creates /var/log/journal itself on start.
Storage=persistent

# Both bounds, because they protect different things. SystemMaxUse bounds the
# root filesystem, which this VM shares with the Xet transfer cache (docs/deployment-status.md
# treats ~50 GiB there as the working ceiling); MaxRetentionSec bounds how far
# back an operator can look.
#
# 1 GiB is deliberate headroom rather than a measurement: the whole of the Phase
# 7 deployment — the retention rotation, the hardening probes, the credential
# work — came to 8 MiB, and a steady-state scheduled sync logs a handful of
# lines a day. Sizing to observed volume would leave no room for the one run
# that goes wrong at length.
SystemMaxUse=1G

# A year covers four quarterly verifications (the timer defaults), so the question "what did
# the last one report, and the one before it" is always answerable from the
# journal rather than only from the archive.
MaxRetentionSec=1year

# SystemKeepFree is left at its default of 15% of the filesystem. That is the
# setting that stops the journal from being the thing that fills the disk out
# from under a download, and the default is already the right answer.
